[project]
name = "recto"
version = "0.1.0"
description = "Lightweight macOS personal research assistant"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "scikit-learn>=1.4",
]

[project.scripts]
recto = "recto.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
