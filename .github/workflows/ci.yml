name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest -q
      # Tests patch config.IS_* to cover every OS branch from one machine.
      # The smoke run is the other half: real directories, the real secret
      # store, and the OS's own validator for the scheduler artifact.
      - name: platform smoke
        run: uv run python scripts/platform_smoke.py

  # The digest is written and read as UTF-8 everywhere. A Windows runner
  # under a non-UTF-8 codepage is where that assumption breaks, so pin the
  # console to legacy cp1252 and prove the pipeline still round-trips.
  windows-legacy-codepage:
    name: test (windows, cp1252 console)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - name: pytest with UTF-8 mode disabled
        env:
          PYTHONUTF8: "0"
          PYTHONIOENCODING: cp1252
        run: uv run pytest -q
      - name: platform smoke with UTF-8 mode disabled
        env:
          PYTHONUTF8: "0"
          PYTHONIOENCODING: cp1252
        run: uv run python scripts/platform_smoke.py
